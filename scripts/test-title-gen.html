<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Title Generation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        textarea {
            width: 100%;
            height: 200px;
            font-family: monospace;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        textarea.system-prompt {
            height: 100px;
        }
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 10px;
            font-family: inherit;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
            min-height: 100px;
        }
        .log {
            font-family: monospace;
            white-space: pre-wrap;
            margin: 5px 0;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Test Title Generation API</h1>
    <p>Use this page to test the title generation API with different prompts and models.</p>
    
    <div class="form-group">
        <label for="model">Model Selection:</label>
        <select id="model">
            <option value="anthropic/claude-3-haiku:beta">Claude 3 Haiku</option>
            <option value="anthropic/claude-3-sonnet:beta">Claude 3 Sonnet</option>
            <option value="anthropic/claude-3-opus:beta">Claude 3 Opus</option>
            <option value="openai/gpt-3.5-turbo">GPT-3.5 Turbo</option>
            <option value="openai/gpt-4">GPT-4</option>
            <option value="openai/gpt-4-turbo">GPT-4 Turbo</option>
            <option value="google/gemini-pro">Gemini Pro</option>
            <option value="meta-llama/llama-3-8b-instruct">Llama 3 8B</option>
        </select>
    </div>
    
    <div class="form-group">
        <label for="systemPrompt">System Prompt:</label>
        <textarea id="systemPrompt" class="system-prompt">You are a helpful assistant that generates concise, descriptive titles for AI prompts. Create titles that are 2-6 words and capture the essence of what the prompt does. Use natural, conversational capitalization (don't capitalize every word) to make titles feel more human and authentic. The tone should be straightforward and descriptive rather than overly creative or metaphorical.</textarea>
    </div>
    
    <div class="form-group">
        <label for="content">Prompt Content:</label>
        <textarea id="content">This is a test prompt content.

I would like to generate a great email template for customer service.
It should be professional but friendly, and include placeholders for:
- Customer name
- Order number
- Issue description
- Resolution steps</textarea>
    </div>
    
    <button id="generate">Generate Title</button>
    
    <div id="result">
        <p>Results will appear here...</p>
    </div>

    <script>
        document.getElementById('generate').addEventListener('click', async () => {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p class="log">Starting title generation test...</p>';
            
            const content = document.getElementById('content').value;
            const systemPrompt = document.getElementById('systemPrompt').value;
            const model = document.getElementById('model').value;
            
            try {
                const log = (message, className = '') => {
                    const p = document.createElement('p');
                    p.className = `log ${className}`;
                    p.textContent = message;
                    resultDiv.appendChild(p);
                };
                
                log(`Model: ${model}`);
                log(`Making API request to /api/generate-title...`);
                
                const response = await fetch('/api/generate-title', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        content,
                        systemPrompt,
                        model
                    }),
                });
                
                log(`Response status: ${response.status}`);
                
                const data = await response.json();
                log(`Response data: ${JSON.stringify(data, null, 2)}`);
                
                if (data.success && data.title) {
                    log(`Generated title: "${data.title}"`, 'success');
                } else {
                    log(`Title generation failed: ${data.message || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                log(`Error making API request: ${error.message}`, 'error');
            }
        });
    </script>
</body>
</html>
